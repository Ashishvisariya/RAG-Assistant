services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rag-backend
    env_file:
      - .env
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:80,http://127.0.0.1:80}
    ports:
      - "8001:8001"
    command: uvicorn app:app --host 0.0.0.0 --port 8001

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rag-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
